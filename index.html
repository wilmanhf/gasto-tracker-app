<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>💰 Gasto Tracker</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .container {
      background: white;
      border-radius: 20px;
      padding: 40px;
      max-width: 500px;
      text-align: center;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    }
    h1 { font-size: 48px; margin-bottom: 10px; }
    p { color: #666; margin-bottom: 30px; font-size: 18px; }
    button {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      padding: 15px 40px;
      font-size: 16px;
      border-radius: 10px;
      cursor: pointer;
      margin: 10px;
      transition: transform 0.2s;
    }
    button:active { transform: scale(0.95); }
    .status { margin-top: 30px; padding: 20px; background: #f0f0f0; border-radius: 10px; }
    .status h3 { margin-bottom: 10px; color: #333; }
    .status p { color: #666; font-size: 14px; }
  </style>
</head>
<body>
  <div class="container">
    <h1>💰</h1>
    <h1>Gasto Tracker</h1>
    <p>Sistema de Inteligencia Financiera</p>
    
    <button onclick="alert('📸 Captura OCR: Próximamente')">📸 Capturar Gasto</button>
    <button onclick="alert('📊 Dashboard: Próximamente')">📊 Ver Dashboard</button>
    <button onclick="alert('💾 Historial: Próximamente')">💾 Historial</button>
    
    <div class="status">
      <h3>✅ App Desplegada</h3>
      <p>Tu aplicación está VIVA en Vercel</p>
      <p style="margin-top: 10px; font-size: 12px;">Versión: 1.0.0</p>
    </div>
  </div>
</body>
</html>
